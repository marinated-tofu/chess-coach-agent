services:
  - type: web
    name: chess-coach-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chess-coach-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LICHESS_API_TOKEN
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-5.5
      - key: STOCKFISH_DEPTH
        value: "7"
      - key: MONITORING_LOG_PATH
        value: /tmp/chess-coach-events.jsonl
      - key: ENABLE_LOCAL_EMBEDDINGS
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: LICHESS_CLIENT_ID
        value: chess-coach-agent
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"

databases:
  - name: chess-coach-db
    plan: free
    databaseName: chess_coach
    user: chess_coach
