name: Deploy to Cloud Run

# Manual until the Google Cloud setup replaces Render. Switch to `push: branches: [main]`
# after cutover.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  IMAGE: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/chess-coach/app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: |
          gcloud run deploy chess-coach \
            --image "$IMAGE" \
            --region "$REGION" \
            --quiet

      - name: Smoke test
        run: |
          url=$(gcloud run services describe chess-coach --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 10 "$url/api/health"
